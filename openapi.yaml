openapi: 3.0.3
info:
  title: Artefact EOM Workspace Tool Service
  description: OpenAPI tool connector for Google Cloud Agent Platform to manage Drive extraction, Slides generation, Sheets audit checklists, and Lead email notifications.
  version: 1.0.0
servers:
  - url: https://eom-workspace-service-6vcfc2gc7q-ew.a.run.app
    description: Cloud Run Production Service
paths:
  /launch-mission:
    post:
      operationId: launch_mission_kickoff
      summary: Step 2 - Initializes mission workspace folder, 3-section Debrief Google Doc, and sends kickoff email
      description: Creates the mission workspace, 01_Visuals & Diagrams subfolder, structured Debrief Doc (Challenge, Solution, Results), dispatches kickoff email, and logs status LAUNCHED in central tracker.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - missionName
                - leadEmail
              properties:
                missionName:
                  type: string
                  description: Name of the mission
                leadEmail:
                  type: string
                  description: Delivery manager email
                client:
                  type: string
                  description: Client company name
                teamEmails:
                  type: array
                  items:
                    type: string
                  description: Optional project team members to CC
                folderId:
                  type: string
                  description: Optional existing mission folder ID
                parentFolderId:
                  type: string
                  description: Optional parent folder ID
                deadlineDate:
                  type: string
                  description: Target debrief deadline date
      responses:
        '200':
          description: Mission kickoff successfully initialized and email sent.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  missionName:
                    type: string
                  folderUrl:
                    type: string
                  docUrl:
                    type: string
                  visualsFolderUrl:
                    type: string
                  emailStatus:
                    type: string

  /extract-documents:
    post:
      operationId: extract_folder_documents
      summary: Extracts text contents and metadata of documents in a Google Drive mission folder
      description: Reads Google Docs, Slides, and text files from the specified Drive folder, ignoring previously generated artifacts.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - folderId
              properties:
                folderId:
                  type: string
                  description: The Google Drive folder ID or full URL of the mission folder.
      responses:
        '200':
          description: Successfully extracted mission files.
          content:
            application/json:
              schema:
                type: object
                properties:
                  folderId:
                    type: string
                  missionName:
                    type: string
                    description: Inferred mission name from the folder title.
                  filesCount:
                    type: integer
                  files:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        name:
                          type: string
                        mimeType:
                          type: string
                        content:
                          type: string
                  aggregatedContext:
                    type: string
                    description: Formatted combined text of all extracted documents ready for synthesis.

  /generate-slide:
    post:
      operationId: generate_one_pager_slide
      summary: Clones the Master Slide Template and populates the 4 executive debrief cards
      description: Clones the Artefact Master One-Pager Slide into the target mission folder, then updates all placeholders with executive synthesis data.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - folderId
                - missionName
                - cardData
              properties:
                folderId:
                  type: string
                  description: Google Drive Folder ID where the generated slide should be stored.
                missionName:
                  type: string
                  description: Name of the mission (e.g., Clariane, TotalEnergies).
                templateId:
                  type: string
                  description: Optional Google Slides Master Template ID. Defaults to Artefact Executive Master Template.
                  default: "197zP6K146fFlNSPDrDuHoUiKS9c0KODiypl_u27XWDQ"
                cardData:
                  type: object
                  description: 4-card executive content generated by the Executive Synthesizer.
                  required:
                    - context
                    - deliverables
                    - businessImpact
                    - recommendations
                  properties:
                    context:
                      type: string
                      description: 2-3 concise sentences on client background, initial problem, and mission objectives.
                    deliverables:
                      type: string
                      description: Bullet points summarizing core technical solutions, models, architecture, and deliverables built.
                    businessImpact:
                      type: string
                      description: Quantifiable business impact, performance gains, ROI, efficiency improvements, or strategic value.
                    recommendations:
                      type: string
                      description: Critical takeaways, operational recommendations, and next steps for the client or team.
                    synthesis:
                      type: string
                      description: An integrated executive summary combining all cards.
      responses:
        '200':
          description: Slide presentation generated successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  presentationId:
                    type: string
                  presentationUrl:
                    type: string
                  title:
                    type: string

  /create-audit-sheet:
    post:
      operationId: create_audit_sheet
      summary: Creates the [Checklist & Audit] Google Sheet in the mission folder
      description: Builds a styled Google Sheet with confidentiality risk tiers (CRITICAL, HIGH, MEDIUM, LOW), suggested categorization tags, and interactive checkboxes for internal Know export.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - folderId
                - missionName
                - auditRecords
              properties:
                folderId:
                  type: string
                  description: Target Google Drive folder ID.
                missionName:
                  type: string
                  description: Name of the mission.
                auditRecords:
                  type: array
                  description: List of audited project files evaluated by the Security Auditor.
                  items:
                    type: object
                    required:
                      - filename
                      - confidentialityRisk
                      - suggestedTags
                      - toBeExported
                    properties:
                      filename:
                        type: string
                      confidentialityRisk:
                        type: string
                        enum: [LOW, MEDIUM, HIGH, CRITICAL]
                      suggestedTags:
                        type: string
                        description: Comma-separated categorization tags.
                      toBeExported:
                        type: boolean
                        description: True if safe and eligible for the internal Know repository.
      responses:
        '200':
          description: Audit spreadsheet created successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  spreadsheetId:
                    type: string
                  spreadsheetUrl:
                    type: string
                  title:
                    type: string
                  rowsCount:
                    type: integer

  /send-notification:
    post:
      operationId: send_lead_notification
      summary: Sends an HTML email notification to the mission lead
      description: Emails the Mission Lead with direct links to the generated Google Slides One-Pager and Google Sheets Checklist.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - recipientEmail
                - missionName
                - slideUrl
                - sheetUrl
              properties:
                recipientEmail:
                  type: string
                  description: Email address of the mission lead.
                missionName:
                  type: string
                  description: Name of the mission.
                slideUrl:
                  type: string
                  description: URL to the generated Google Slides deck.
                sheetUrl:
                  type: string
                  description: URL to the generated Google Sheets checklist.
      responses:
        '200':
          description: Email dispatched successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  recipientEmail:
                    type: string
