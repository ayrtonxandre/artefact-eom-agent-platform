openapi: 3.0.3
info:
  title: Artefact EOM Workspace Tool Service
  description: OpenAPI tool connector for Google Cloud Agent Platform to manage Drive extraction, Slides generation, Sheets audit checklists, and Lead email notifications.
  version: 1.0.0
servers:
  - url: https://eom-workspace-service-6vcfc2gc7q-ew.a.run.app
    description: Cloud Run Production Service
paths:
  /missions/detect:
    post:
      operationId: detect_upcoming_missions
      summary: Step 1 - Queries BigQuery for client missions ending at J-7 or custom date
      description: Queries global-finance-dashboard.marts_ext_eom_chat.mart_ext_eom_chat_missions to detect ending missions.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                daysAhead:
                  type: integer
                  default: 7
                  description: Number of days ahead to scan (default 7 for J-7 kickoff)
                targetDate:
                  type: string
                  description: Specific target date YYYY-MM-DD
                clientName:
                  type: string
                  description: Optional filter by client name
                leadEmail:
                  type: string
                  description: Optional filter by lead email
                limit:
                  type: integer
                  default: 50
      responses:
        '200':
          description: List of detected missions.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    mission_id:
                      type: string
                    mission_name:
                      type: string
                    client_name:
                      type: string
                    industry:
                      type: string
                    lead_email:
                      type: string
                    end_date:
                      type: string
                    days_until_end:
                      type: integer

  /missions/detect-and-launch:
    post:
      operationId: detect_and_launch_missions
      summary: Step 1 to Step 2 Orchestrator - Detects upcoming missions and launches Step 2 for new ones
      description: Autonomous pipeline trigger that detects J-7 missions from BigQuery, verifies against Central Tracker, and launches uninitialized missions.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                daysAhead:
                  type: integer
                  default: 7
                targetDate:
                  type: string
                clientName:
                  type: string
                autoLaunch:
                  type: boolean
                  default: true
                dryRun:
                  type: boolean
                  default: false
                overrideLeadEmail:
                  type: string
                  description: Optional lead email redirect for staging/testing
                limit:
                  type: integer
                  default: 10
      responses:
        '200':
          description: Execution summary of detected and launched missions.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  total_detected:
                    type: integer
                  launched_count:
                    type: integer
                  skipped_count:
                    type: integer
                  missions:
                    type: array
                    items:
                      type: object

  /launch-mission:
    post:
      operationId: launch_mission_kickoff
      summary: Step 2 - Initializes mission workspace folder, 3-section Debrief Google Doc, and sends kickoff email
      description: Creates the mission workspace, 01_Visuals & Diagrams subfolder, structured Debrief Doc (Challenge, Solution, Results), dispatches kickoff email, and logs status LAUNCHED in central tracker.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - missionName
                - leadEmail
              properties:
                missionName:
                  type: string
                  description: Name of the mission
                leadEmail:
                  type: string
                  description: Delivery manager email
                client:
                  type: string
                  description: Client company name
                teamEmails:
                  type: array
                  items:
                    type: string
                  description: Optional project team members to CC
                folderId:
                  type: string
                  description: Optional existing mission folder ID
                parentFolderId:
                  type: string
                  description: Optional parent folder ID
                deadlineDate:
                  type: string
                  description: Target debrief deadline date
      responses:
        '200':
          description: Mission kickoff successfully initialized and email sent.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  missionName:
                    type: string
                  folderUrl:
                    type: string
                  docUrl:
                    type: string
                  visualsFolderUrl:
                    type: string
                  emailStatus:
                    type: string

  /missions/check-debrief:
    post:
      operationId: check_mission_debrief_status
      summary: Step 3 - Checks debrief Google Doc completion and placeholder removal
      description: Inspects a mission Google Doc or folder to analyze the 3 pillars (Challenge, Solution, Results) for completed content.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                docId:
                  type: string
                  description: Google Doc ID or URL
                folderId:
                  type: string
                  description: Google Drive mission folder ID or URL
                missionName:
                  type: string
                  description: Mission name
      responses:
        '200':
          description: Debrief completion analysis.
          content:
            application/json:
              schema:
                type: object
                properties:
                  docId:
                    type: string
                  isCompleted:
                    type: boolean
                  completionRate:
                    type: number
                  completedSections:
                    type: array
                    items:
                      type: string
                  missingSections:
                    type: array
                    items:
                      type: string

  /send-reminder:
    post:
      operationId: send_mission_reminder
      summary: Step 3 - Sends J-3 or J-1 reminder email to mission lead if debrief is incomplete
      description: Evaluates debrief completion, dispatches corporate Artefact reminder HTML email, and updates Central Status Tracker.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - missionName
                - leadEmail
              properties:
                missionName:
                  type: string
                leadEmail:
                  type: string
                client:
                  type: string
                folderId:
                  type: string
                docId:
                  type: string
                daysRemaining:
                  type: integer
                  default: 3
                deadlineDate:
                  type: string
                overrideLeadEmail:
                  type: string
                dryRun:
                  type: boolean
                  default: false
      responses:
        '200':
          description: Reminder execution result.
          content:
            application/json:
              schema:
                type: object

  /missions/reminders:
    post:
      operationId: trigger_eom_reminders
      summary: Step 3 - Automated Batch Reminder Scanner
      description: Scans Central Pipeline Status Tracker for active missions (LAUNCHED, REMINDER_J3), inspects debrief doc completion, and dispatches J-3 / J-1 reminders.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                daysAhead:
                  type: integer
                forceSend:
                  type: boolean
                  default: false
                dryRun:
                  type: boolean
                  default: false
                overrideLeadEmail:
                  type: string
                limit:
                  type: integer
                  default: 20
      responses:
        '200':
          description: Batch reminder report.
          content:
            application/json:
              schema:
                type: object

  /extract-documents:
    post:
      operationId: extract_folder_documents
      summary: Extracts text contents and metadata of documents in a Google Drive mission folder
      description: Reads Google Docs, Slides, and text files from the specified Drive folder, ignoring previously generated artifacts.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - folderId
              properties:
                folderId:
                  type: string
                  description: The Google Drive folder ID or full URL of the mission folder.
      responses:
        '200':
          description: Successfully extracted mission files.
          content:
            application/json:
              schema:
                type: object
                properties:
                  folderId:
                    type: string
                  missionName:
                    type: string
                    description: Inferred mission name from the folder title.
                  filesCount:
                    type: integer
                  files:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        name:
                          type: string
                        mimeType:
                          type: string
                        content:
                          type: string
                  aggregatedContext:
                    type: string
                    description: Formatted combined text of all extracted documents ready for synthesis.

  /generate-slide:
    post:
      operationId: generate_one_pager_slide
      summary: Clones the Master Slide Template and populates the 4 executive debrief cards
      description: Clones the Artefact Master One-Pager Slide into the target mission folder, then updates all placeholders with executive synthesis data.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - folderId
                - missionName
                - cardData
              properties:
                folderId:
                  type: string
                  description: Google Drive Folder ID where the generated slide should be stored.
                missionName:
                  type: string
                  description: Name of the mission (e.g., Clariane, TotalEnergies).
                templateId:
                  type: string
                  description: Optional Google Slides Master Template ID. Defaults to Artefact Executive Master Template.
                  default: "197zP6K146fFlNSPDrDuHoUiKS9c0KODiypl_u27XWDQ"
                cardData:
                  type: object
                  description: 4-card executive content generated by the Executive Synthesizer.
                  required:
                    - context
                    - deliverables
                    - businessImpact
                    - recommendations
                  properties:
                    context:
                      type: string
                      description: 2-3 concise sentences on client background, initial problem, and mission objectives.
                    deliverables:
                      type: string
                      description: Bullet points summarizing core technical solutions, models, architecture, and deliverables built.
                    businessImpact:
                      type: string
                      description: Quantifiable business impact, performance gains, ROI, efficiency improvements, or strategic value.
                    recommendations:
                      type: string
                      description: Critical takeaways, operational recommendations, and next steps for the client or team.
                    synthesis:
                      type: string
                      description: An integrated executive summary combining all cards.
      responses:
        '200':
          description: Slide presentation generated successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  presentationId:
                    type: string
                  presentationUrl:
                    type: string
                  title:
                    type: string

  /create-audit-sheet:
    post:
      operationId: create_audit_sheet
      summary: Creates the [Checklist & Audit] Google Sheet in the mission folder
      description: Builds a styled Google Sheet with confidentiality risk tiers (CRITICAL, HIGH, MEDIUM, LOW), suggested categorization tags, and interactive checkboxes for internal Know export.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - folderId
                - missionName
                - auditRecords
              properties:
                folderId:
                  type: string
                  description: Target Google Drive folder ID.
                missionName:
                  type: string
                  description: Name of the mission.
                auditRecords:
                  type: array
                  description: List of audited project files evaluated by the Security Auditor.
                  items:
                    type: object
                    required:
                      - filename
                      - confidentialityRisk
                      - suggestedTags
                      - toBeExported
                    properties:
                      filename:
                        type: string
                      confidentialityRisk:
                        type: string
                        enum: [LOW, MEDIUM, HIGH, CRITICAL]
                      suggestedTags:
                        type: string
                        description: Comma-separated categorization tags.
                      toBeExported:
                        type: boolean
                        description: True if safe and eligible for the internal Know repository.
      responses:
        '200':
          description: Audit spreadsheet created successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  spreadsheetId:
                    type: string
                  spreadsheetUrl:
                    type: string
                  title:
                    type: string
                  rowsCount:
                    type: integer

  /send-notification:
    post:
      operationId: send_lead_notification
      summary: Sends an HTML email notification to the mission lead
      description: Emails the Mission Lead with direct links to the generated Google Slides One-Pager and Google Sheets Checklist.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - recipientEmail
                - missionName
                - slideUrl
                - sheetUrl
              properties:
                recipientEmail:
                  type: string
                  description: Email address of the mission lead.
                missionName:
                  type: string
                  description: Name of the mission.
                slideUrl:
                  type: string
                  description: URL to the generated Google Slides deck.
                sheetUrl:
                  type: string
                  description: URL to the generated Google Sheets checklist.
      responses:
        '200':
          description: Email dispatched successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  recipientEmail:
                    type: string
